<text x="792" y="203.0" font-family="Geist, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#141413">Context block</text>
<text x="792" y="218.0" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#5c5a55">clock, 14-day calendar,</text>
<text x="792" y="230.0" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#5c5a55">MEMORY with dates</text>
<text x="32" y="360" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#5c5a55">About 1 ms, no model call. A day with no history reaches the model as "no exchanges recorded", which stops it inventing one.</text>
<text x="32" y="374" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#5c5a55">Ambiguity is kept: "last Tuesday" on a Thursday gives two candidate days; memory decides which is real.</text>
