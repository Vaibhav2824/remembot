<style>
  /* Tokens: the Instrument system, .interface-design/system.md. No literal values past this block. */
  :root {
    --canvas: #f6f6f7; --raised: #ffffff; --raised-2: #efeff1; --sunken: #ececee;
    --hairline: rgb(20 20 22 / 0.09); --hairline-strong: rgb(20 20 22 / 0.16);
    --text-1: #141416; --text-2: #55565e; --text-3: #6b6c74; --text-off: #a5a6ad;
    --signal: #e8912a; --signal-ink: #1a1205; --signal-text: #a15c00; --signal-wash: rgb(232 145 42 / 0.14);
    --danger: #c2362b; --scrim: rgb(20 20 22 / 0.32); --mask: #000;
    --shadow-float: 0 0 0 1px rgb(20 20 22 / 0.06), 0 2px 4px rgb(20 20 22 / 0.04), 0 8px 24px rgb(20 20 22 / 0.08);

    --sans: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --t-display: 600 32px/1.1 var(--sans); --t-title: 600 18px/1.35 var(--sans); --t-body: 400 15px/1.65 var(--sans);
    --t-ui: 500 14px/1.4 var(--sans); --t-small: 400 13px/1.45 var(--sans); --t-readout: 400 12px/1.4 var(--mono);

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px;
    --side: 288px; --col: 720px; --measure: 68ch;
    --r-xs: 2px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
    --d-press: 120ms; --d-quick: 160ms; --d-detent: 200ms; --d-drawer: 280ms;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-move: cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --z-bar: 10; --z-drawer: 20; --z-island: 30; --z-tooltip: 40;

    /* Transitional aliases: old names point at the system until each area is migrated, then go. */
    --line: var(--hairline);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #111214; --raised: #18191c; --raised-2: #212226; --sunken: #0c0d0e;
      --hairline: rgb(255 255 255 / 0.07); --hairline-strong: rgb(255 255 255 / 0.12);
      --text-1: #ececee; --text-2: #a0a0a8; --text-3: #8b8c94; --text-off: #5b5c63;
      --signal: #f0a43a; --signal-text: #f0a43a; --signal-wash: rgb(240 164 58 / 0.12);
      --danger: #ff6b5e; --scrim: rgb(0 0 0 / 0.55);
      --shadow-float: 0 0 0 1px rgb(255 255 255 / 0.06), 0 8px 24px rgb(0 0 0 / 0.45);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: clip; scrollbar-color: var(--raised-2) transparent; }
  body { margin: 0; height: 100dvh; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); background: var(--canvas); color: var(--text-1);
    font: var(--t-body); overflow: clip; }
  ::selection { background: var(--signal-wash); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--signal-text); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font: var(--t-readout); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .skip { position: absolute; left: var(--s3); top: calc(-1 * var(--s16)); z-index: var(--z-tooltip); background: var(--text-1); color: var(--canvas);
    padding: var(--s2) var(--s3); border-radius: var(--r-sm); }
  .skip:focus { top: var(--s3); }

  /* Buttons: secondary controls. The send button is the only primary. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 36px; padding: var(--s2) var(--s3);
    background: var(--raised); color: var(--text-1); border: 0; box-shadow: inset 0 0 0 1px var(--hairline); border-radius: var(--r-sm); font: var(--t-ui);
    transition: transform var(--d-press) var(--ease-out), background-color var(--d-quick) var(--ease-out), color var(--d-quick) var(--ease-out); }
  @media (hover: hover) { .btn:not(:disabled):hover { background: var(--raised-2); } }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: var(--sunken); color: var(--text-off); box-shadow: none; cursor: not-allowed; transform: none; }
  @media (pointer: coarse) { .btn { min-height: 44px; } }

  /* ---------- Memory panel ---------- */
  aside { background: var(--canvas); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: var(--s3); padding: var(--s5) var(--s4) var(--s1); }
  .brand svg { width: 28px; height: 28px; }
  h1 { margin: 0; font: var(--t-title); letter-spacing: -0.01em; }
  .tagline { margin: 0; padding: 0 var(--s4); color: var(--text-2); font: var(--t-small); }
  .note { font: var(--t-small); color: var(--text-3); text-wrap: pretty; }

  /* Day scrubber: 14 days, bar height = exchanges that day. */
  .scrub { margin: var(--s4) var(--s4) var(--s2); padding: var(--s3) var(--s3) var(--s2); background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); border-radius: var(--r-md); }
  .scrub header { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--s1) var(--s3); }
  .scrub header b { font: var(--t-small); font-weight: 500; }
  #days { display: grid; grid-template-columns: repeat(14, 1fr); gap: var(--s1); align-items: end; height: 64px; }
  #days button { all: unset; display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: var(--s1); height: 100%; cursor: pointer; }
  #days button:disabled { cursor: default; }
  /* Bars grow by scaleY from a 4px stub to 40px, so only transform animates. */
  #days i { align-self: end; width: 100%; max-width: 12px; height: 40px; border-radius: var(--r-xs); background: var(--hairline-strong);
    transform: scaleY(calc((4 + var(--h, 0) * 36) / 40)); transform-origin: bottom;
    transition: transform var(--d-detent) var(--ease-out), background-color var(--d-quick) var(--ease-out); }
  #days button:not(:disabled) i { background: var(--text-3); }
  #days button.today i { background: var(--signal); }
  @media (hover: hover) { #days button:not(:disabled):hover i { background: var(--text-1); } }
  #days button.on i { background: var(--text-1); }
  #days span { font: var(--t-readout); font-family: var(--sans); line-height: 1; color: var(--text-3); }
  #days button.today span { color: var(--signal-text); }
  #days button:focus-visible i { outline: 2px solid var(--signal-text); outline-offset: 2px; }

  /* Scroll fade (after Skiper's free "scroll with fade"): edges dissolve instead of cutting off. */
  #timeline { overflow-y: auto; padding: var(--s1) var(--s4) var(--s4); flex: 1; overscroll-behavior: contain;
    mask-image: linear-gradient(transparent, var(--mask) 14px, var(--mask) calc(100% - 24px), transparent); }
  #days { touch-action: none; user-select: none; }
  .day { position: relative; padding-left: var(--s4); margin-top: var(--s4); }
  .day::before { content: ""; position: absolute; left: 4px; top: 22px; bottom: 6px; width: 1px; background: var(--hairline); }
  .day h2 { margin: 0 0 var(--s1) calc(-1 * var(--s4)); font: var(--t-small); font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: var(--s2); scroll-margin-top: var(--s2); }
  .day h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--canvas); box-shadow: inset 0 0 0 2px var(--text-3); }
  .day.flash h2::before { background: var(--signal); box-shadow: 0 0 0 4px var(--signal-wash); }
  .day.flash h2 { color: var(--text-1); }
  #timeline details { border-radius: var(--r-md); padding: var(--s2); margin: 0 calc(-1 * var(--s2)); transition: background-color var(--d-quick) var(--ease-out); }
  @media (hover: hover) { #timeline details:hover { background: var(--raised); } }
  #timeline details[open] { background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); margin-block: var(--s2); }
  #timeline summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: baseline; font: var(--t-ui); }
  #timeline summary::-webkit-details-marker { display: none; }
  #timeline summary b { font-weight: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timeline details[open] summary b { white-space: normal; }
  #timeline .stored { font: var(--t-small); margin-top: var(--s2); color: var(--text-2); }
  .empty-memory { margin: var(--s5) 0; padding: var(--s4); border: 1px dashed var(--line); border-radius: 12px; color: var(--text-2); font: var(--t-small); text-wrap: pretty; }
  aside footer { padding: var(--s4); border-top: 1px solid var(--hairline); display: grid; gap: var(--s2); }
  aside footer .btn { justify-content: center; width: 100%; }
  aside footer .note { text-align: center; }

  /* ---------- Chat ---------- */
  main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: var(--s3) var(--s6); }
  .clock { color: var(--text-3); } /* a readout, not a control: no container */
  #menu { display: none; }
  #chat { flex: 1; overflow-y: auto; padding: var(--s3) var(--s6) var(--s10); } /* no smooth scroll: it runs on every streamed token */
  #chat > * { max-width: var(--col); margin-inline: auto; }

  /* Welcome: a heading, one sentence, then the example questions as a ruled list. No badges, no cards. */
  .welcome { padding-top: 9vh; }
  .welcome h2 { font: var(--t-display); letter-spacing: -0.03em; margin: 0 0 var(--s3); text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
  .welcome h2 span { display: inline-block; } /* break between the two sentences, not inside one */
  .welcome .lede { color: var(--text-2); margin: 0 0 var(--s8); max-width: 54ch; font: var(--t-body); text-wrap: pretty; }
  .examples { list-style: none; margin: 0 0 var(--s6); padding: 0; border-top: 1px solid var(--hairline); }
  .examples li { border-bottom: 1px solid var(--hairline); }
  .examples button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: var(--s1) var(--s4);
    align-items: baseline; padding: var(--s3) var(--s2); border-radius: var(--r-sm); transition: background-color var(--d-quick) var(--ease-out); }
  @media (hover: hover) { .examples button:hover { background: var(--raised); } }
  .examples button:active { background: var(--raised-2); }
  .examples button:focus-visible { outline: 2px solid var(--signal-text); outline-offset: -2px; }
  .examples .tag { font: var(--t-small); color: var(--text-3); }
  .examples .q { font: var(--t-ui); color: var(--text-1); text-wrap: pretty; }
  .hint { margin: 0; max-width: 54ch; font: var(--t-small); color: var(--text-3); display: flex; gap: var(--s2); align-items: flex-start; text-wrap: pretty; }
  .hint svg { margin-top: 2px; }
  @media (max-width: 480px) { .examples button { grid-template-columns: minmax(0, 1fr); } }

  /* Staggered entry */
  /* One entrance, for the welcome screen only: it shows on load and on New chat, not on every keystroke. */
  .rise { animation: rise var(--d-drawer) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  @keyframes fade { from { opacity: 0; } }

  .msg { margin-bottom: var(--s10); } /* messages appear on Enter: no entrance animation */
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .body { background: var(--raised); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--hairline); border-radius: var(--r-md);
    padding: var(--s3) var(--s4); max-width: 80%; white-space: pre-wrap; text-wrap: pretty; }
  .msg.agent .body { font: var(--t-body); max-width: var(--measure); }
  .msg.agent .body:empty { display: none; }
  .body p { margin: 0 0 var(--s3); text-wrap: pretty; } .body p:last-child, .body ul:last-child { margin-bottom: 0; }
  .body ul { margin: 0 0 var(--s3); padding-left: var(--s5); } .body li { margin-bottom: var(--s2); } .body li::marker { color: var(--text-3); }
  .body strong { font-weight: 600; }
  .body code { font: var(--t-readout); background: var(--raised-2); padding: 0 var(--s1); border-radius: var(--r-xs); }
  .body a:not(.cite) { color: inherit; text-decoration-color: var(--signal-text); text-underline-offset: 3px; }
  a.cite { position: relative; display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 var(--s1); margin: 0 2px; vertical-align: 2px;
    font: var(--t-readout); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; color: var(--signal-text); background: var(--signal-wash); border-radius: var(--r-sm); text-decoration: none;
    transition: background-color var(--d-quick) var(--ease-out), color var(--d-quick) var(--ease-out); }
  a.cite:hover, a.cite:focus-visible { background: var(--signal); color: var(--signal-ink); }
  a.cite[data-tip]:is(:hover, :focus-visible)::after { content: attr(data-tip); position: absolute; bottom: calc(100% + var(--s2)); left: 50%; transform: translateX(-50%); z-index: var(--z-tooltip);
    width: max-content; max-width: 280px; padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--raised-2); color: var(--text-1); box-shadow: var(--shadow-float);
    font: var(--t-small); font-weight: 500; white-space: pre-line; text-align: left; pointer-events: none; transform-origin: bottom center; animation: tip var(--d-quick) var(--ease-out); }
  @keyframes tip { from { opacity: 0; transform: translateX(-50%) translateY(2px) scale(0.97); } }

  /* Trace: what the agent did, folded into one quiet line above the answer. */
  .trace { margin: 0 0 var(--s3); }
  .trace summary { display: inline-flex; align-items: center; gap: var(--s2); font: var(--t-small); color: var(--text-3); cursor: pointer; list-style: none; border-radius: var(--r-xs);
    transition: color var(--d-quick) var(--ease-out); }
  .trace summary::-webkit-details-marker { display: none; }
  .trace summary::after { content: ""; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg);
    transition: transform var(--d-quick) var(--ease-out); }
  .trace[open] summary::after { transform: translateY(1px) rotate(225deg); }
  @media (hover: hover) { .trace summary:hover { color: var(--text-2); } }
  .trace ol { margin: var(--s2) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
  .trace li { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); font: var(--t-small); color: var(--text-2); }
  .trace li svg { color: var(--text-3); }
  .chip { font: var(--t-small); padding: 2px var(--s2); border-radius: var(--r-sm); background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--text-2);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sources { margin: var(--s3) 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--s2); }
  .sources:empty { display: none; }
  .sources a { display: flex; align-items: center; gap: var(--s2); max-width: 280px; font: var(--t-small); color: var(--text-2); background: var(--raised);
    box-shadow: inset 0 0 0 1px var(--hairline); border-radius: var(--r-sm); padding: var(--s1) var(--s3) var(--s1) var(--s2); text-decoration: none;
    transition: background-color var(--d-quick) var(--ease-out), color var(--d-quick) var(--ease-out); }
  @media (hover: hover) { .sources a:hover { background: var(--raised-2); color: var(--text-1); } }
  .sources b { font: var(--t-readout); font-variant-numeric: tabular-nums; color: var(--text-3); }
  .sources img { width: 14px; height: 14px; }
  .sources span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin-top: var(--s3); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); }
  .meta:empty { display: none; }
  .error { color: var(--danger); }
  .cursor::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: var(--s2); border-radius: 50%; background: var(--signal); vertical-align: 1px;
    animation: breathe 1.2s var(--ease-move) infinite; }
  .msg.agent .body.cursor:empty { display: block; }
  @keyframes breathe { 50% { opacity: 0.35; } } /* live state: opacity only, no scaling */

  /* Status island: one live line for what the agent is doing right now. */
  .dock { position: relative; padding: 0 var(--s6) max(var(--s5), env(safe-area-inset-bottom)); }
  /* Progressive blur (after Skiper's free "progressive blur"): text sinks under the composer. */
  .dock::before { content: ""; position: absolute; inset: calc(-1 * var(--s10)) 0 100%; pointer-events: none; background: linear-gradient(transparent, var(--canvas));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); mask-image: linear-gradient(transparent, var(--mask) 70%); }
  .bar { position: relative; z-index: 1; }
  .bar::after { content: ""; position: absolute; inset: 100% 0 -20px; pointer-events: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    mask-image: linear-gradient(var(--mask), transparent); }
  /* Search meter (after Bencho's free "context meter"): six cells, one per search a message may use. */
  .meter { display: inline-flex; align-items: center; gap: var(--s1); margin-right: var(--s2); vertical-align: 1px; }
  .meter b { width: 14px; height: 6px; border-radius: var(--r-xs); background: var(--hairline-strong); }
  .meter b.on { background: var(--signal); animation: cell var(--d-detent) var(--ease-out) both; animation-delay: calc(var(--n) * 40ms); }
  @keyframes cell { from { opacity: 0; } }
  #island { position: absolute; left: 50%; top: calc(-1 * var(--s12)); display: flex; align-items: center; gap: var(--s2); max-width: calc(100% - var(--s12)); padding: var(--s2) var(--s4) var(--s2) var(--s3);
    border-radius: var(--r-pill); background: var(--raised-2); color: var(--text-1); font: var(--t-small); font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-float);
    z-index: var(--z-island); opacity: 0; transform: translate(-50%, var(--s2)) scale(0.96); pointer-events: none;
    transition: opacity var(--d-press) var(--ease-out), transform var(--d-press) var(--ease-out); } /* leaves faster than it arrives */
  #island.on { opacity: 1; transform: translate(-50%, 0) scale(1); transition-duration: var(--d-detent); }
  #island span { overflow: hidden; text-overflow: ellipsis; }
  #island i { width: 6px; height: 6px; border-radius: var(--r-xs); flex: none; background: var(--signal); animation: breathe 1.2s var(--ease-move) infinite; }
  #island.wait i { background: var(--text-3); }
  #island.wait i, #island.error i { animation: none; }
  #island.error i { background: var(--danger); }
  .composer { max-width: var(--col); margin-inline: auto; display: flex; gap: var(--s2); align-items: flex-end; background: var(--raised);
    box-shadow: inset 0 0 0 1px var(--hairline-strong); border-radius: var(--r-lg); padding: var(--s2) var(--s2) var(--s2) var(--s4); }
  .composer:focus-within { box-shadow: inset 0 0 0 1px var(--signal-text); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: var(--t-body); max-height: 180px; padding: var(--s2) 0;
    caret-color: var(--signal-text); } /* Skiper's free "smooth caret input", the part CSS can do */
  textarea::placeholder { color: var(--text-3); }
  textarea:focus-visible { outline: none; } /* the composer edge shows focus */
  /* Send: the one primary action. Stop reuses it with a square icon. */
  #send { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 0; border-radius: var(--r-pill); background: var(--signal); color: var(--signal-ink);
    transition: transform var(--d-press) var(--ease-out), background-color var(--d-quick) var(--ease-out), color var(--d-quick) var(--ease-out); }
  @media (hover: hover) { #send:not(:disabled):hover { background: color-mix(in oklab, var(--signal) 86%, var(--text-1)); } }
  #send:active { transform: scale(0.97); }
  #send:disabled { background: var(--hairline-strong); color: var(--text-off); cursor: not-allowed; transform: none; }
  #send svg { width: 17px; height: 17px; stroke-width: 2.2; }
  @media (pointer: coarse) { #send { width: 44px; height: 44px; } }
  .under { max-width: var(--col); margin: var(--s2) auto 0; display: flex; justify-content: space-between; font: var(--t-small); color: var(--text-3); }
  kbd { font: inherit; padding: 0 var(--s1); border-radius: var(--r-xs); box-shadow: inset 0 0 0 1px var(--hairline-strong); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: var(--z-drawer);
      transition: transform var(--d-drawer) var(--ease-drawer), visibility 0s var(--d-drawer); }
    .js aside { transform: translateX(-100%); visibility: hidden; } /* closed drawer: off-screen and out of the tab order */
    .js body.menu-open aside { transform: none; visibility: visible; transition-delay: 0s; box-shadow: 0 0 0 100vmax var(--scrim); }
    #menu { display: inline-flex; }
    .bar { padding: var(--s2) var(--s4); } #chat { padding: var(--s2) var(--s4) var(--s8); } .dock { padding-inline: var(--s4); }
    .under span:first-child { display: none; }
    .btn { white-space: nowrap; }
  }
  @media (max-width: 480px) {
    .clock { display: none; }
  }
  /* Reduced motion: keep fades and colour changes, drop anything that moves or scales. */
  @media (prefers-reduced-motion: reduce) {
    .rise { animation-name: fade; }
    a.cite[data-tip]:is(:hover, :focus-visible)::after { animation-name: fade; transform: translateX(-50%); }
    #island, #island.on { transform: translate(-50%, 0); }
    #days i { transition: background-color var(--d-quick) var(--ease-out); }
    .trace summary::after, aside { transition: none; }
    .btn:active, #send:active { transform: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#input">Skip to message box</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></symbol>
  <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <symbol id="i-memory" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-wait" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 6 8 9s-8 4-8 9M16 3c0 5-8 6-8 9"/></symbol>
</svg>
<aside id="memory" aria-label="Memory">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--signal)"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="var(--signal-ink)" stroke-width="2.5"/><path d="M16 11.5V16l3 2" fill="none" stroke="var(--signal-ink)" stroke-width="2.5" stroke-linecap="round"/></svg>
    <h1>Asof</h1>
  </div>
  <p class="tagline">Remembers what you asked, and when.</p>
  <section class="scrub" aria-label="Last 14 days">
    <header><b>Last 14 days</b><span class="mono" id="count"></span></header>
    <div id="days"></div>
  </section>
  <div id="timeline"></div>
  <footer>
    <button class="btn" id="demo" type="button" title="Replays three real questions through the agent with the clock set to past days"><svg class="i" aria-hidden="true"><use href="#i-rewind"/></svg><span>Load demo memory</span></button>
    <span class="note">Replays 3 questions, takes about 30 s</span>
  </footer>
</aside>

<main>
  <div class="bar">
    <button class="btn" id="menu" type="button" aria-controls="memory" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg>Memory</button>
    <span class="clock mono" id="clock"></span>
    <button class="btn" id="new" type="button" title="Starts an empty conversation. Memory is kept."><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>New chat</button>
  </div>
  <div id="chat" aria-live="polite"></div>
  <form id="form" class="dock">
    <div id="island" role="status"><i></i><span></span></div>
    <div class="composer">
      <label for="input" hidden>Message</label>
      <textarea id="input" rows="1" placeholder="Ask anything. Ask again next week." maxlength="2000" autofocus></textarea>
      <button id="send" type="submit" aria-label="Send" disabled><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </div>
    <div class="under"><span><kbd>Enter</kbd> to send, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span><span>One tool: web search</span></div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id)
const chat = $('chat'), input = $('input'), sendBtn = $('send'), demoBtn = $('demo'), island = $('island')

// Identity is a random id kept in this browser. Memory belongs to it, across every chat.
let userId = null
try { userId = localStorage.getItem('asof-user') } catch {}
if (!userId) { userId = crypto.randomUUID(); try { localStorage.setItem('asof-user', userId) } catch {} }
let threadId = crypto.randomUUID()
const tz = -new Date().getTimezoneOffset()
let busy = null // AbortController while a reply is streaming

const EXAMPLES = [
  ['Recall and recheck', 'Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?'],
  ['Exact date', 'What did I ask you on 3 November? Is your answer still correct today?'],
  ['Diff since Monday', 'On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing or shipped something big since?'],
]

// ---------- rendering ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const safeUrl = (u) => (/^https?:\/\//i.test(u) ? esc(u) : '#')
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, '') } catch { return '' } }
const icon = (name) => `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`
const link = (href, inner, attrs = '') => `<a ${attrs} href="${href}" target="_blank" rel="noopener noreferrer">${inner}</a>`
const timeOf = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
const dayOf = (ms) => new Date(ms).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })
const dayKey = (ms) => new Date(ms).toLocaleDateString('en-CA') // YYYY-MM-DD, local
const DAY = 86_400_000

// Minimal, escape-first markdown: everything is escaped, then a few safe patterns are turned back into tags.
function markdown(text, sources) {
  text = text.replace(/【(\d+)[^】]*】/g, '[$1]').replace(/(\[\d+\])(?:\s*\1)+/g, '$1') // some models cite as 【1†L2-L5】, twice
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+?)\*(?![*\w])/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => link(url, label))
    .replace(/\[(\d+)\]/g, (_, n) => { const s = sources[n - 1]; return s ? link(safeUrl(s.url), n, `class="cite" data-tip="${esc(s.title)}&#10;${esc(host(s.url))}"`) : '' })
  const out = []
  let items = []
  const flush = () => { if (items.length) out.push(`<ul>${items.join('')}</ul>`); items = [] }
  for (const line of text.split('\n')) {
    const bullet = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/)
    if (bullet) items.push(`<li>${inline(bullet[1])}</li>`)
    else { flush(); if (line.trim()) out.push(`<p>${inline(line.replace(/^#+\s*/, ''))}</p>`) }
  }
  flush()
  return out.join('')
}

const scrollDown = () => { chat.scrollTop = chat.scrollHeight }

function addMessage(role, text = '') {
  const el = document.createElement('article')
  el.className = `msg ${role}`
  el.innerHTML = role === 'user'
    ? `<div class="body"></div>`
    : `<details class="trace" hidden><summary></summary><ol></ol></details><div class="body"></div><ul class="sources"></ul><div class="meta mono"></div>`
  el.querySelector('.body').textContent = text
  chat.append(el)
  scrollDown()
  return el
}

function welcome() {
  chat.innerHTML = `<section class="welcome">
    <h2 class="rise"><span>Ask something.</span> <span>Ask again next week.</span></h2>
    <p class="lede rise" style="--i:1">One tool, web search. Every exchange is remembered with the time it happened, so you can ask what you asked, when, and whether the answer still holds.</p>
    <ul class="examples" aria-label="Try one">${EXAMPLES.map(([tag, q], i) => `<li class="rise" style="--i:${i + 2}"><button type="button" data-q="${esc(q)}">
      <span class="tag">${esc(tag)}</span><span class="q">${esc(q)}</span></button></li>`).join('')}</ul>
    <p class="hint rise" style="--i:5">${icon('rewind')}<span>New here? “Load demo memory” replays three real questions as if asked on 3 November, last Monday and last Tuesday.</span></p>
  </section>`
  chat.querySelectorAll('.examples button').forEach((b) => b.addEventListener('click', () => send(b.dataset.q)))
}

let islandTimer = 0
function status(text, kind = '') {
  clearTimeout(islandTimer)
  if (!text) { island.classList.remove('on'); return }
  island.className = `on ${kind}`
  island.querySelector('span').textContent = text
  if (kind === 'error') islandTimer = setTimeout(() => status(''), 6000)
}

function scrubber(turns) {
  const counts = {}
  for (const t of turns) counts[dayKey(t.askedAt)] = (counts[dayKey(t.askedAt)] || 0) + 1
  const max = Math.max(1, ...Object.values(counts))
  const today = dayKey(Date.now())
  $('days').innerHTML = Array.from({ length: 14 }, (_, i) => {
    const ms = Date.now() - (13 - i) * DAY, k = dayKey(ms), n = counts[k] || 0
    const label = `${dayOf(ms)}: ${n || 'no'} exchange${n === 1 ? '' : 's'}`
    return `<button type="button" data-day="${k}" class="${k === today ? 'today' : ''}" ${n ? '' : 'disabled'} title="${label}" aria-label="${label}" style="--h:${n / max}">
      <i></i><span>${new Date(ms).toLocaleDateString([], { weekday: 'narrow' })}</span></button>`
  }).join('')
  const days = new Set(Object.keys(counts)).size
  $('count').textContent = turns.length ? `${turns.length} asked over ${days} day${days === 1 ? '' : 's'}` : ''
}

async function loadTimeline() {
  const turns = await fetch(`/api/turns?userId=${userId}`).then((r) => (r.ok ? r.json() : [])).catch(() => [])
  scrubber(turns)
  const box = $('timeline')
  if (!turns.length) { box.innerHTML = '<p class="empty-memory">Nothing remembered yet. Everything you ask lands here, grouped by day, with the sources the answer cited.</p>'; return }
  const name = (ms) => { const k = dayKey(ms); return k === dayKey(Date.now()) ? 'Today' : k === dayKey(Date.now() - DAY) ? 'Yesterday' : dayOf(ms) }
  let html = '', day = ''
  for (const t of turns) {
    if (dayKey(t.askedAt) !== day) {
      if (day) html += '</div>'
      day = dayKey(t.askedAt)
      html += `<div class="day" id="d-${day}"><h2>${esc(name(t.askedAt))}</h2>`
    }
    html += `<details><summary><span class="mono">${timeOf(t.askedAt)}</span><b>${esc(t.question)}</b></summary>
      <div class="stored body">${markdown(t.answer, t.sources)}</div></details>`
  }
  box.innerHTML = html + '</div>'
}

// ---------- streaming ----------
async function* stream(path, body, signal) {
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal })
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Request failed (${res.status})`)
  const reader = res.body.getReader(), decoder = new TextDecoder()
  let buffer = ''
  for (;;) {
    const { value, done } = await reader.read()
    if (done) return
    buffer += decoder.decode(value, { stream: true })
    const frames = buffer.split('\n\n')
    buffer = frames.pop()
    for (const f of frames) if (f.startsWith('data: ')) yield JSON.parse(f.slice(6))
  }
}

function setBusy(controller) {
  busy = controller
  sendBtn.classList.toggle('stop', !!busy)
  sendBtn.setAttribute('aria-label', busy ? 'Stop' : 'Send')
  sendBtn.innerHTML = icon(busy ? 'stop' : 'arrow')
  sendBtn.disabled = !busy && !input.value.trim()
  demoBtn.disabled = !!busy
}

async function send(text) {
  text = text.trim()
  if (!text || busy) return
  if (chat.querySelector('.welcome')) chat.innerHTML = ''
  input.value = ''; input.style.height = 'auto'
  addMessage('user', text)
  const el = addMessage('agent')
  const trace = el.querySelector('.trace'), body = el.querySelector('.body'), meta = el.querySelector('.meta')
  // The trace folds into one line ("Recalled 3 exchanges, searched 2 times"); the steps open beneath it.
  const did = { recalled: 0, missing: false, searched: 0, waited: 0 }
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`
  const summary = () => {
    const parts = [
      did.recalled ? `recalled ${plural(did.recalled, 'exchange')}` : did.missing ? 'nothing remembered for that day' : '',
      did.searched ? `searched ${plural(did.searched, 'time')}` : '',
      did.waited ? `waited ${did.waited} s for the model` : '',
    ].filter(Boolean).join(', ')
    return parts.charAt(0).toUpperCase() + parts.slice(1)
  }
  const step = (kind, html) => {
    trace.querySelector('ol').insertAdjacentHTML('beforeend', `<li class="${kind}">${icon(kind)}${html}</li>`)
    trace.querySelector('summary').textContent = summary()
    trace.hidden = false
    scrollDown()
  }
  let answer = '', sources = [], firstTokenMs = 0
  const started = performance.now()
  const paint = () => { body.innerHTML = markdown(answer, sources); scrollDown() }

  setBusy(new AbortController())
  body.classList.add('cursor')
  status('Recalling')
  try {
    for await (const e of stream('/api/chat', { userId, threadId, message: text, tz }, busy.signal)) {
      if (e.type === 'memory') {
        const found = e.windows.filter((w) => w.count)
        did.recalled += found.reduce((n, w) => n + w.count, 0) + (e.related || 0)
        did.missing = !found.length && e.windows.length > 0
        if (found.length) step('memory', `Remembered ${found.map((w) => `${w.count} from <b>${esc(w.label)}</b>`).join(', ')}`)
        else if (e.windows.length) step('memory', `Nothing remembered for ${e.windows.map((w) => `<b>${esc(w.label)}</b>`).join(' or ')}`)
        if (e.related) step('memory', `Remembered ${e.related} related exchange${e.related > 1 ? 's' : ''}`)
        status('Thinking')
      } else if (e.type === 'search') {
        answer = ''; paint() // anything said before a search was a preamble, not the answer
        did.searched += e.queries.length
        step('search', `Searched ${e.queries.map((q) => `<span class="chip">${esc(q)}</span>`).join('')}`)
        status(e.queries.length > 1 ? `Searching ${e.queries.length} queries in parallel` : 'Searching the web')
      } else if (e.type === 'wait') {
        did.waited += e.seconds
        step('wait', `Model rate limit reached, retrying in ${e.seconds} s`)
        status(`Rate limited, retrying in ${e.seconds} s`, 'wait')
      } else if (e.type === 'sources') {
        sources = e.sources
      } else if (e.type === 'text') {
        if (!firstTokenMs) { firstTokenMs = performance.now() - started; status('Writing') }
        answer += e.delta; paint()
      } else if (e.type === 'done') {
        const shown = body.innerHTML // rendered, so 【n†…】 citations are already normalised to [n] links
        const cited = sources.filter((s) => shown.includes(`>${s.n}</a>`))
        el.querySelector('.sources').innerHTML = cited.map((s) => `<li>${link(safeUrl(s.url),
          `<b>${s.n}</b><img src="https://icons.duckduckgo.com/ip3/${esc(host(s.url))}.ico" alt="" loading="lazy" onerror="this.remove()"><span>${esc(s.title)}</span>`,
          `title="${esc(s.title)}"`)}</li>`).join('')
        const secs = (ms) => (ms / 1000).toFixed(1) + ' s'
        meta.innerHTML = [timeOf(e.askedAt), `first word ${secs(firstTokenMs)}`, `done ${secs(performance.now() - started)}`,
          e.searches ? `<span class="meter" aria-hidden="true">${Array.from({ length: 6 }, (_, i) => `<b class="${i < e.searches ? 'on' : ''}" style="--n:${i}"></b>`).join('')}</span>${e.searches} of 6 searches`
            : 'Answered from memory'].map((s) => `<span>${s}</span>`).join('')
        loadTimeline()
      } else if (e.type === 'error') {
        throw new Error(e.message)
      }
    }
    status('')
  } catch (err) {
    if (err.name === 'AbortError') { meta.innerHTML = '<span>Stopped. Not saved to memory.</span>'; status('') }
    else { meta.innerHTML = `<span class="error">${esc(err.message)}</span>`; status('Something went wrong', 'error') }
  }
  body.classList.remove('cursor')
  setBusy(null)
  input.focus()
}

async function loadDemo() {
  if (busy) return
  setBusy(new AbortController())
  const label = demoBtn.querySelector('span'), original = label.textContent
  status('Replaying demo memory')
  try {
    for await (const e of stream('/api/demo', { userId, tz }, busy.signal)) {
      if (e.type === 'demo') { label.textContent = `Replaying ${e.step} of ${e.total}`; status(`Replaying ${e.step} of ${e.total}: ${e.label}`) }
      if (e.type === 'error') throw new Error(e.message)
      await loadTimeline()
    }
    status('')
  } catch (err) {
    if (err.name !== 'AbortError') status(`Could not load demo memory: ${err.message}`, 'error')
  }
  label.textContent = original
  setBusy(null)
  await loadTimeline()
}

// ---------- wiring ----------
$('form').addEventListener('submit', (e) => { e.preventDefault(); busy ? busy.abort() : send(input.value) })
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value) } })
input.addEventListener('input', () => {
  input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'
  if (!busy) sendBtn.disabled = !input.value.trim()
})
$('new').addEventListener('click', () => { if (busy) return; threadId = crypto.randomUUID(); welcome(); input.focus() })
// Phone drawer: the button reports its state, Escape or a tap outside closes it, focus moves in and comes back.
const menuBtn = $('menu'), memory = $('memory')
function setMenu(open) {
  if (document.body.classList.contains('menu-open') === open) return
  document.body.classList.toggle('menu-open', open)
  menuBtn.setAttribute('aria-expanded', String(open))
  if (open) memory.querySelector('button:not(:disabled), summary')?.focus()
  else if (memory.contains(document.activeElement)) menuBtn.focus()
}
menuBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenu(!document.body.classList.contains('menu-open')) })
document.querySelector('main').addEventListener('click', () => setMenu(false))
addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false) })
// Time scrubber (after Bencho's free block): click a day, or press and drag across the bars.
function jumpTo(b) {
  const group = b && !b.disabled && $(`d-${b.dataset.day}`)
  if (!group) return
  document.querySelectorAll('.day.flash').forEach((d) => d.classList.remove('flash'))
  document.querySelectorAll('#days .on').forEach((d) => d.classList.remove('on'))
  group.classList.add('flash'); b.classList.add('on')
  group.querySelector('h2').scrollIntoView({ block: 'start' })
}
let scrubbing = false
const dayAt = (e) => document.elementFromPoint(e.clientX, e.clientY)?.closest('#days button')
$('days').addEventListener('pointerdown', (e) => { scrubbing = true; jumpTo(dayAt(e)) })
$('days').addEventListener('pointermove', (e) => { const b = scrubbing && dayAt(e); if (b && !b.classList.contains('on')) jumpTo(b) })
addEventListener('pointerup', () => { scrubbing = false })
$('days').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jumpTo(e.target.closest('button')) } })
demoBtn.addEventListener('click', loadDemo)
const tick = () => { $('clock').textContent = `${dayOf(Date.now())}, ${timeOf(Date.now())}` }
tick(); setInterval(tick, 30_000)
welcome()
loadTimeline()
</script>
</body>
</html>
