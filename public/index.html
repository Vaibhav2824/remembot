<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1917">
<title>Remembot</title>
<meta name="description" content="Your chats with Remembot, the chat agent that searches the live web and remembers what you asked, and when.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://remembot.asof-agent.workers.dev/">
<meta property="og:title" content="Remembot: ask anything, ask again next week">
<meta property="og:description" content="A chat agent that searches the live web and remembers what you asked, and when.">
<meta property="og:image" content="https://remembot.asof-agent.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<script src="/boot.js"></script>
<style>
  :root { --side: 280px; --rail: 56px; --col: 720px; --measure: 68ch; }
  html { overscroll-behavior: none; }
  body { height: 100dvh; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); overflow: clip; }

  /* ---------- Sidebar ---------- */
  aside { background: var(--side-bg); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .side-top { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s3) var(--s2) var(--s4); min-height: 60px; }
  .brand { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .wordmark { font: 600 20px/1 var(--serif); letter-spacing: -0.01em; white-space: nowrap; }
  #collapse { margin-left: auto; }
  .panel { display: flex; flex-direction: column; min-height: 0; flex: 1; width: var(--side); }
  .side-new { display: flex; align-items: center; gap: var(--s2); margin: var(--s1) var(--s3) var(--s3); padding: var(--s2) var(--s3); border: 0; border-radius: var(--r-sm);
    background: none; color: var(--text-1); font: var(--t-ui); text-align: left; transition: background-color var(--d-quick) var(--ease); }
  .side-new .plus { width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r-pill); background: var(--signal); color: var(--signal-ink); }
  .side-new .plus svg { width: 14px; height: 14px; stroke-width: 2.2; }
  @media (hover: hover) and (pointer: fine) { .side-new:hover { background: var(--raised-2); } }
  .rail { display: none; flex-direction: column; align-items: center; gap: var(--s2); padding-top: var(--s1); }
  .rail .plus { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-pill); background: var(--signal); color: var(--signal-ink); }
  .rail .plus svg { width: 15px; height: 15px; stroke-width: 2.2; }

  /* Day scrubber: 14 bars, height = questions that day. One slider control. */
  .scrub { margin: 0 var(--s3) var(--s2); padding: var(--s3) var(--s3) var(--s2); border-radius: var(--r-md); background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); }
  .scrub header { display: flex; justify-content: space-between; padding: 0 var(--s1) var(--s2); }
  .scrub header b { font: var(--t-small); font-weight: 500; color: var(--text-2); }
  #days { display: grid; grid-template-columns: repeat(14, 1fr); gap: var(--s1); align-items: end; height: 56px; border-radius: var(--r-sm); touch-action: pan-y; user-select: none; }
  #days:focus-visible { outline-offset: 4px; }
  #days .col { display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: var(--s1); height: 100%; }
  #days .col.has { cursor: pointer; }
  #days i { align-self: end; width: 100%; max-width: 10px; height: 36px; border-radius: var(--r-xs); background: var(--hairline-strong);
    transform: scaleY(calc((4 + var(--h, 0) * 32) / 36)); transform-origin: bottom; transition: background-color var(--d-quick) var(--ease); }
  #days .col.has i { background: var(--text-3); }
  #days .col.today i { background: var(--signal); }
  @media (hover: hover) and (pointer: fine) { #days .col.has:hover i { background: var(--text-1); } }
  #days .col.on i, #days .col.spy:not(.on) i { background: var(--text-1); }
  #days b { font: 400 11px/1 var(--sans); color: var(--text-3); }
  #days .col.today b { color: var(--signal-text); }

  #timeline { overflow-y: auto; padding: 0 var(--s3) var(--s4); flex: 1; overscroll-behavior: contain; }
  .day { margin-top: var(--s3); }
  .day h2 { position: sticky; top: 0; z-index: 1; margin: 0; padding: var(--s2) var(--s3) var(--s1); background: var(--side-bg); font: var(--t-small); font-weight: 500; color: var(--text-3); }
  .day.flash h2 { color: var(--signal-text); }
  .day ul { list-style: none; margin: 0; padding: 0; }
  .chat { position: relative; display: flex; align-items: center; border-radius: var(--r-sm); transition: background-color var(--d-quick) var(--ease); }
  .chat-link { flex: 1; min-width: 0; padding: var(--s2) var(--s3); font: var(--t-small); color: var(--text-1); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: var(--r-sm); }
  .chat.active { background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); }
  .chat.active .chat-link { font-weight: 500; }
  .chat.active::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--signal); }
  .del { flex: none; display: inline-flex; align-items: center; gap: var(--s1); height: 28px; margin-right: var(--s1); padding: 0 var(--s2); border: 0; border-radius: var(--r-sm); background: none; color: var(--text-3); opacity: 0;
    transition: opacity var(--d-quick) var(--ease), background-color var(--d-quick) var(--ease), color var(--d-quick) var(--ease); }
  .del svg { width: 15px; height: 15px; }
  .del span { display: none; font: 500 12px/1 var(--sans); }
  .del.armed { opacity: 1; background: var(--danger); color: var(--canvas); }
  .del.armed span { display: inline; }
  .chat:hover .del, .chat:focus-within .del, .chat.active .del { opacity: 1; }
  @media (hover: hover) and (pointer: fine) { .chat:not(.active):hover { background: var(--raised-2); } .del:not(.armed):hover { background: var(--sunken); color: var(--text-1); } }
  @media (pointer: coarse) { .del { opacity: 0.7; height: 40px; } .chat-link { padding-block: var(--s3); } }
  .memory-note { margin: var(--s3); font: var(--t-small); color: var(--text-3); }
  .memory-note.error { color: var(--danger); }

  .account { position: relative; padding: var(--s2) var(--s3) max(var(--s3), env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hairline); }
  #account-btn { width: 100%; display: flex; align-items: center; gap: var(--s3); padding: var(--s2); border: 0; border-radius: var(--r-md); background: none; text-align: left; }
  @media (hover: hover) and (pointer: fine) { #account-btn:hover { background: var(--raised-2); } }
  .avatar { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--text-1); color: var(--canvas); font: 600 13px/1 var(--sans); text-box: trim-both cap alphabetic; }
  .who { display: grid; min-width: 0; }
  .who b, .who small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who b { font: var(--t-ui); } .who small { font: var(--t-small); color: var(--text-3); }
  #account-menu { position: absolute; left: var(--s3); right: var(--s3); bottom: calc(100% - var(--s1)); z-index: var(--z-tooltip); display: grid; padding: var(--s1); border-radius: var(--r-md);
    background: var(--raised); box-shadow: var(--shadow-float); transform-origin: 50% 100%; }
  #account-menu a, #account-menu button { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border: 0; border-radius: var(--r-sm); background: none; font: var(--t-small); color: var(--text-1); text-decoration: none; text-align: left; }
  @media (hover: hover) and (pointer: fine) { #account-menu a:hover, #account-menu button:hover { background: var(--raised-2); } }
  #account-menu hr { margin: var(--s1) 0; border: 0; border-top: 1px solid var(--hairline); }
  #account-menu .danger { color: var(--danger); }
  dialog { width: min(420px, calc(100vw - 32px)); padding: var(--s6); border: 0; border-radius: var(--r-xl); background: var(--raised); color: var(--text-1); box-shadow: var(--shadow-float); }
  dialog::backdrop { background: var(--scrim); }
  dialog h2 { margin: 0 0 var(--s2); font: 500 22px/1.25 var(--serif); }
  dialog p { margin: 0 0 var(--s4); color: var(--text-2); font: var(--t-small); }
  dialog form { display: grid; gap: var(--s4); }
  dialog .row { display: flex; justify-content: flex-end; gap: var(--s2); }
  #left { align-self: center; font: var(--t-readout); color: var(--text-3); }
  #left.low { color: var(--danger); }
  #island.on:not(.wait):not(.error) i { animation: pulse 1.1s var(--ease) infinite; }
  @keyframes pulse { 50% { transform: scale(1.7); opacity: 0.45; } }

  /* Desktop: the sidebar collapses to a slim rail of icons, so the page never leaves an empty column. */
  @media (min-width: 821px) {
    html.ready body { transition: grid-template-columns var(--d-panel) var(--ease); }
    html.collapsed body { grid-template-columns: var(--rail) minmax(0, 1fr); }
    html.collapsed .panel, html.collapsed .wordmark, html.collapsed #collapse, html.collapsed .who { display: none; }
    html.collapsed .account { padding-inline: var(--s2); }
    html.collapsed #account-menu { left: var(--s2); right: auto; width: 220px; }
    html.collapsed .side-top { justify-content: center; padding-inline: 0; }
    html.collapsed .rail { display: flex; }
    #menu, #new { display: none; }
  }

  /* ---------- Chat ---------- */
  main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); min-height: 60px; }
  .clock { margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: var(--s2) var(--s6) var(--s10); }
  #thread > * { max-width: var(--col); margin-inline: auto; }

  /* Empty state: a greeting and the composer, centred together. */
  main.empty { justify-content: center; padding-bottom: 14vh; }
  main.empty .bar { position: absolute; inset: 0 0 auto; }
  main.empty #chat { flex: 0 0 auto; overflow: visible; padding-bottom: var(--s6); }
  .welcome { display: flex; align-items: center; justify-content: center; gap: var(--s3); }
  .welcome .mark { width: 30px; height: 30px; }
  .welcome h2 span { display: inline-block; }
  .welcome h2 { margin: 0; font: var(--t-greet); letter-spacing: -0.015em; text-wrap: balance; text-align: center; }
  .tries { display: none; list-style: none; max-width: var(--col); margin: var(--s4) auto 0; padding: 0; flex-wrap: wrap; justify-content: center; gap: var(--s2); }
  main.empty .tries { display: flex; }
  .tries button { min-height: 36px; padding: var(--s2) var(--s4); border: 0; border-radius: var(--r-pill); background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline-strong);
    color: var(--text-2); font: var(--t-ui); transition: background-color var(--d-quick) var(--ease), color var(--d-quick) var(--ease); }
  @media (hover: hover) and (pointer: fine) { .tries button:hover { background: var(--raised-2); color: var(--text-1); } }

  /* Messages */
  .msg { margin-bottom: var(--s8); }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .body { max-width: 80%; padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--raised-2); white-space: pre-wrap; }
  .msg.agent .body { font: var(--t-answer); max-width: var(--measure); }
  .msg.agent .body:empty { display: none; }
  .body p { margin: 0 0 var(--s3); text-wrap: pretty; } .body p:last-child, .body ul:last-child { margin-bottom: 0; }
  .body ul { margin: 0 0 var(--s3); padding-left: var(--s5); } .body li { margin-bottom: var(--s2); } .body li::marker { color: var(--text-3); }
  .body strong { font-weight: 600; }
  .body code { font: var(--t-readout); background: var(--raised-2); padding: 1px var(--s1); border-radius: 4px; }
  .body a:not(.cite) { color: inherit; text-decoration-color: var(--signal-text); text-underline-offset: 3px; }
  a.cite { position: relative; display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 var(--s1); margin: 0 2px; vertical-align: 2px;
    font: 500 11px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--signal-text); background: var(--signal-wash); border-radius: var(--r-pill); text-decoration: none;
    transition: background-color var(--d-quick) var(--ease), color var(--d-quick) var(--ease); }
  a.cite:hover, a.cite:focus-visible { background: var(--signal); color: var(--signal-ink); }
  a.cite[data-tip]:is(:hover, :focus-visible)::after { content: attr(data-tip); position: absolute; bottom: calc(100% + var(--s2)); left: 50%; transform: translateX(-50%); z-index: var(--z-tooltip);
    width: max-content; max-width: 280px; padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--raised); color: var(--text-1); box-shadow: var(--shadow-float);
    font: var(--t-small); white-space: pre-line; text-align: left; pointer-events: none; }

  .trace { margin: 0 0 var(--s3); }
  .trace summary { display: inline-flex; align-items: center; gap: var(--s2); font: var(--t-small); color: var(--text-3); cursor: pointer; list-style: none; border-radius: 4px; }
  .trace summary::-webkit-details-marker { display: none; }
  .trace summary::after { content: ""; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); }
  .trace[open] summary::after { transform: translateY(1px) rotate(225deg); }
  @media (hover: hover) and (pointer: fine) { .trace summary:hover { color: var(--text-2); } }
  .trace ol { margin: var(--s2) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
  .trace li { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); font: var(--t-small); color: var(--text-2); }
  .trace li svg { width: 15px; height: 15px; color: var(--text-3); }
  .chip { font: var(--t-small); padding: 2px var(--s2); border-radius: var(--r-pill); background: var(--raised-2); color: var(--text-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sources { margin: var(--s4) 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--s2); }
  .sources:empty { display: none; }
  .sources a { display: flex; align-items: center; gap: var(--s2); max-width: 280px; padding: var(--s1) var(--s3) var(--s1) var(--s2); border-radius: var(--r-pill);
    background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--text-2); font: var(--t-small); text-decoration: none;
    transition: background-color var(--d-quick) var(--ease), color var(--d-quick) var(--ease); }
  @media (hover: hover) and (pointer: fine) { .sources a:hover { background: var(--raised-2); color: var(--text-1); } }
  .sources b { font: var(--t-readout); color: var(--text-3); }
  .sources img { width: 14px; height: 14px; }
  .sources span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin-top: var(--s3); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s4); }
  .meta:empty { display: none; }
  .meta .copy { margin-left: auto; padding: var(--s1) var(--s2); border: 0; border-radius: var(--r-sm); background: none; font: var(--t-small); color: var(--text-3); }
  @media (hover: hover) and (pointer: fine) { .meta .copy:hover { background: var(--raised-2); color: var(--text-1); } }
  .error { color: var(--danger); }
  .meta .error { font: var(--t-small); }
  .meter { display: inline-flex; align-items: center; gap: 3px; margin-right: var(--s2); vertical-align: 1px; }
  .meter b { width: 12px; height: 5px; border-radius: var(--r-xs); background: var(--hairline-strong); }
  .meter b.on { background: var(--signal); }
  .cursor::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: var(--s2); border-radius: 50%; background: var(--signal); vertical-align: 1px; }
  .msg.agent .body.cursor:empty { display: block; }

  /* Composer */
  .dock { position: relative; padding: 0 var(--s6) max(var(--s4), env(safe-area-inset-bottom)); background: var(--canvas); }
  .composer { max-width: var(--col); margin-inline: auto; display: flex; gap: var(--s2); align-items: flex-end; padding: var(--s3) var(--s3) var(--s3) var(--s5);
    border-radius: var(--r-xl); background: var(--raised); box-shadow: var(--shadow-composer); transition: box-shadow var(--d-quick) var(--ease); }
  .composer:focus-within { box-shadow: 0 0 0 1px var(--signal-text), var(--shadow-composer); }
  textarea { flex: 1; min-height: 28px; border: 0; outline: 0; resize: none; background: none; color: inherit; font: 400 16px/1.5 var(--sans); max-height: 200px; padding: var(--s1) 0; caret-color: var(--signal-text); }
  textarea::placeholder { color: var(--text-3); }
  textarea:focus-visible { outline: none; } /* the composer ring shows focus */
  #send { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: var(--signal); color: var(--signal-ink);
    transition: background-color var(--d-quick) var(--ease), opacity var(--d-quick) var(--ease); }
  #send:disabled { background: var(--raised-2); color: var(--text-off); cursor: not-allowed; }
  #send svg { width: 17px; height: 17px; stroke-width: 2.2; }
  @media (pointer: coarse) { #send { width: 44px; height: 44px; } }
  #island { position: absolute; left: 50%; top: calc(-1 * var(--s10)); transform: translateX(-50%); display: flex; align-items: center; gap: var(--s2); max-width: calc(100% - var(--s12));
    padding: var(--s1) var(--s3); border-radius: var(--r-pill); background: var(--raised); box-shadow: var(--shadow-float); color: var(--text-2); font: var(--t-small);
    white-space: nowrap; pointer-events: none; z-index: var(--z-island); transition: opacity var(--d-quick) var(--ease); }
  .js #island:not(.on) { opacity: 0; }
  html:not(.js) #island { display: none; }
  #island span { overflow: hidden; text-overflow: ellipsis; }
  #island i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--signal); }
  #island.wait i { background: var(--text-3); }
  #island.error i { background: var(--danger); }
  .latest { position: absolute; top: calc(-1 * var(--s10)); right: max(var(--s6), calc((100% - var(--col)) / 2)); z-index: var(--z-island); display: inline-flex; align-items: center; gap: var(--s1);
    padding: var(--s1) var(--s3); border: 0; border-radius: var(--r-pill); background: var(--raised); box-shadow: var(--shadow-float); color: var(--text-2); font: var(--t-small); }
  .latest svg { width: 14px; height: 14px; transform: rotate(180deg); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: var(--z-drawer); padding-top: env(safe-area-inset-top, 0px);
      transition: transform var(--d-drawer) var(--ease), visibility 0s var(--d-drawer); }
    .js aside { transform: translateX(-100%); visibility: hidden; }
    .js body.menu-open aside { transform: none; visibility: visible; transition-delay: 0s; box-shadow: 0 0 0 100vmax var(--scrim); }
    .panel { width: auto; }
    #collapse, .rail { display: none !important; }
    .bar { padding-top: max(var(--s3), env(safe-area-inset-top, 0px)); }
    .bar, #chat, .dock { padding-left: max(var(--s4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s4), env(safe-area-inset-right, 0px)); }
    #timeline { padding-bottom: max(var(--s4), env(safe-area-inset-bottom, 0px)); }
    main.empty { padding-bottom: 10vh; }
    .welcome h2 { font-size: 30px; }
  }
  @media (max-width: 480px) { .clock { display: none; } }
  @media (pointer: coarse) { #input { font-size: 16px; } }
</style>
</head>
<body>
<a class="skip" href="#input">Skip to message box</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Strata, the Remembot mark (small-size cut): three layers of dated answers in ink, the dot is now. -->
  <symbol id="i-mark" viewBox="0 0 256 256"><path fill="currentColor" d="M48 24H208A28 28 0 0 1 208 80H48A28 28 0 0 1 48 24Z M48 100H160A28 28 0 0 1 160 156H48A28 28 0 0 1 48 100Z M48 176H88A28 28 0 0 1 88 232H48A28 28 0 0 1 48 176Z"/><path fill="var(--signal)" d="M178 204A29 29 0 1 1 236 204A29 29 0 1 1 178 204Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-memory" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-wait" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 8 6 8 9s-8 4-8 9M16 3c0 5-8 6-8 9"/></symbol>
</svg>
<aside id="memory" aria-label="Memory" tabindex="-1">
  <div class="side-top">
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span class="wordmark">Remembot</span></div>
    <button class="icon-btn" id="collapse" type="button" aria-controls="memory" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar (Ctrl+B)"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg></button>
  </div>
  <div class="rail" id="rail">
    <button class="icon-btn" id="expand" type="button" aria-controls="memory" aria-expanded="false" aria-label="Expand sidebar" title="Expand sidebar (Ctrl+B)"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg></button>
    <button class="icon-btn" id="new-rail" type="button" aria-label="New chat" title="New chat"><span class="plus"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></span></button>
  </div>
  <div class="panel" id="panel">
    <button class="side-new" id="new-side" type="button"><span class="plus"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></span>New chat</button>
    <section class="scrub" aria-label="Chats in the last 14 days">
      <header><b>Last 14 days</b><span class="mono" id="count"></span></header>
      <div id="days" role="slider" aria-label="Jump to a day" aria-valuemin="1" aria-valuemax="14"></div>
    </section>
    <nav id="timeline" aria-label="Your chats"><div id="timeline-list" aria-busy="true"><p class="memory-note">Loading your chats…</p></div></nav>
  </div>
  <div class="account">
    <div id="account-menu" hidden>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <button type="button" data-consent-open>Cookie settings</button>
      <hr>
      <button type="button" id="signout"><svg class="i" aria-hidden="true"><use href="#i-out"/></svg>Sign out</button>
      <button type="button" id="delete-account" class="danger"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Delete account</button>
    </div>
    <button type="button" id="account-btn" aria-expanded="false" aria-controls="account-menu" aria-label="Account"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="who"><b id="who-name"></b><small id="who-email"></small></span></button>
  </div>
</aside>

<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">Delete your account?</h2>
  <p>Your account and every saved chat are erased for good. This cannot be undone.</p>
  <form id="delete-form">
    <div class="field">
      <label for="delete-password">Your password</label>
      <div class="well"><input id="delete-password" type="password" autocomplete="current-password" required maxlength="128"></div>
      <span class="hint error" id="delete-error" role="alert"></span>
    </div>
    <div class="row"><button type="button" class="key quiet" id="delete-cancel">Cancel</button><button type="submit" class="key danger" id="delete-confirm">Delete forever</button></div>
  </form>
</dialog>

<main id="main">
  <h1 class="sr-only">Remembot, a chat agent that remembers what you asked and when</h1>
  <div class="bar">
    <button class="icon-btn" id="menu" type="button" aria-controls="memory" aria-expanded="false" aria-label="Memory"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <span class="clock mono" id="clock"></span>
    <button class="icon-btn" id="new" type="button" aria-label="New chat"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </div>
  <div id="chat"><div id="thread" aria-live="polite"></div></div>
  <form id="form" class="dock">
    <div id="island" role="status"><i></i><span></span></div>
    <button class="latest" id="latest" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>Latest</button>
    <div class="composer">
      <label for="input" class="sr-only">Message</label>
      <textarea id="input" rows="1" enterkeyhint="send" placeholder="Ask anything" maxlength="2000" autofocus></textarea>
      <span id="left" aria-live="polite" hidden></span>
      <button id="send" type="submit" aria-label="Send" disabled><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </div>
    <ul class="tries" id="tries" aria-label="Try one"></ul>
  </form>
</main>

<script src="/vendor/motion.js" defer></script>
<script src="/consent.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
